<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The same gel plate as the Dock icons and the JL mark in About: vertical
       Aqua blue with an inset gloss over the top. The gloss is inset rather than
       full width, which is what makes it read as a highlight. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec2f9"/>
      <stop offset="55%" stop-color="#4a90ec"/>
      <stop offset="100%" stop-color="#2f7de0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#plate)"/>
  <path d="M2.4 2.2 H29.6 V12.4 Q29.6 15.6 26 15.6 H6 Q2.4 15.6 2.4 12.4 Z"
        fill="url(#gloss)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="6.6" fill="none"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>

  <text x="16" y="23.6" text-anchor="middle"
        font-family="'Lucida Grande','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="16.5" font-weight="700" fill="#ffffff" letter-spacing="-1.2">JL</text>
</svg>
